[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repocortex"
version = "1.0.0"
description = "Repository-aware coding assistant with AST search, sandboxing, permission gates, cryptographic audit logs, and bug-fix benchmark evaluation."
authors = [{ name = "RepoCortex Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
]
llm = [
    "google-generativeai",
    "openai",
    "anthropic",
]

[project.scripts]
repocortex = "repocortex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repocortex*"]
